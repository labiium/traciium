[package]
name = "traciium"
version = "0.1.0"
edition = "2021"
description = "Visualize and debug agentic traces from .jsonl files"
license = "Apache-2.0"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"

[profile.release]
opt-level = 2
lto = true
